<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>laanhema.dev</title>
    <script>
      (function () {
        try {
          var redirect = sessionStorage.getItem('spa_redirect');
          if (redirect) {
            sessionStorage.removeItem('spa_redirect');
            var currentPath = window.location.pathname + window.location.search + window.location.hash;
            if (redirect !== currentPath) {
              window.history.replaceState(null, '', redirect);
            }
          } else {
            var params = new URLSearchParams(window.location.search);
            var queryRedirect = params.get('p');
            if (queryRedirect) {
              params.delete('p');
              var newSearch = params.toString() ? '?' + params.toString() : '';
              window.history.replaceState(null, '', queryRedirect + newSearch + window.location.hash);
            }
          }

          var navEntries = performance.getEntriesByType('navigation');
          var isReload = navEntries.length > 0
            ? navEntries[0].type === 'reload'
            : (performance.navigation && performance.navigation.type === 1);
          if (isReload) {
            if ('scrollRestoration' in history) {
              history.scrollRestoration = 'manual';
            }
            if (window.location.hash) {
              history.replaceState(null, '', window.location.pathname + window.location.search);
            }
            window.scrollTo(0, 0);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
