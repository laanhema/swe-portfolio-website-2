<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../styles/tokens.css"><link rel="stylesheet" href="../../styles/bundle.css"><meta charset="utf-8"><title>FormField — preview</title><style>html,body{margin:0}</style></head>
<body>
<div class='p-10 bg-white'><form class="animate-on-scroll flex flex-col gap-6" onsubmit="return false">
  <div class="flex flex-col gap-2"><label for="name" class="font-bold uppercase tracking-wider">Name</label><input type="text" id="name" class="brutal-border p-4 bg-[#f8f9fa] focus:outline-none focus:bg-white focus:brutal-shadow transition-all" placeholder="John Doe" /></div>
  <div class="flex flex-col gap-2"><label for="email" class="font-bold uppercase tracking-wider">Email</label><input type="email" id="email" class="brutal-border p-4 bg-white focus:outline-none brutal-shadow transition-all" value="lauri@" /></div>
  <div class="flex flex-col gap-2"><label for="message" class="font-bold uppercase tracking-wider">Message</label><textarea id="message" rows="4" class="brutal-border p-4 bg-[#f8f9fa] focus:outline-none focus:bg-white focus:brutal-shadow transition-all resize-none" placeholder="How can I help you?"></textarea></div>
  <button type="submit" class="mt-4 bg-[#ff3e00] text-white brutal-border py-4 font-bold uppercase text-xl shadow-brutal transition-[transform,box-shadow] duration-100 brutal-shadow-hover touch-manipulation cursor-pointer">Send Message</button>
</form></div>
</body>
</html>
